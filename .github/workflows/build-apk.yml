name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Get dependencies & analyze
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Copy APK with clean name
        run: cp build/app/outputs/flutter-apk/app-release.apk rtm-uv-kalibrasi.apk

      - name: Publish APK to GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RTM UV Kalibrasi Android APK
          make_latest: true
          files: rtm-uv-kalibrasi.apk
